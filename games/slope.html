<html>
<head>
  <base target="_blank">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
    }
    #gameContainer {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0; padding: 0; border: 0;
      background: rgb(35, 31, 32);
    }
    #gameContainer canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    button {
      font-family: inherit;
      appearance: none;
      border: 0;
      border-radius: 5px;
      background: #2c2c2c;
      color: #fff;
      padding: 18px 46px;
      font-size: 28px;
      cursor: pointer;
      position: fixed;
      z-index: 999;
    }
    button:hover { background: #3f3f3f; }
    button:focus { outline: none; box-shadow: 0 0 0 4px #cbd6ee; }
  </style>
</head>
<body>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/cookieclickerunblocked/slp@ddcf1d475e4c9f0c58a6b0cf0cba75b25896b657/style/style.css">

  <div class="webgl-content">
    <div id="gameContainer">
      <canvas id="#canvas" width="700" height="600" style="cursor: default;"></canvas>
      <div class="logo Dark" style="display: none;"></div>
      <div class="progress Dark" style="display: none;">
        <div class="empty" style="width: 0%;"></div>
        <div class="full" style="width: 100%;"></div>
      </div>
    </div>
  </div>

  <script src="https://www.id.net/api/user_data/autologin?callback=idnet_autologin&app_id=55961e5ee694aa0ae90003e8"></script>
  <script src="https://cdn.jsdelivr.net/gh/cookieclickerunblocked/slp@ddcf1d475e4c9f0c58a6b0cf0cba75b25896b657/UnityProgress.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/cookieclickerunblocked/slp@ddcf1d475e4c9f0c58a6b0cf0cba75b25896b657/UnityLoader.js"></script>

  <script type="text/javascript">
    var gameInstance;
    window.onload = function () {
      var bttn = document.createElement("button");
      bttn.appendChild(document.createTextNode("CLICK TO PLAY NOW"));
      bttn.setAttribute('id', 'run_game');
      bttn.style.display = 'none';
      bttn.style.position = 'absolute';
      document.body.appendChild(bttn);
      bttn.style.display = 'block';
      bttn.style.left = ((document.body.clientWidth - bttn.offsetWidth)/2) + 'px';
      bttn.style.top = ((document.body.clientHeight - bttn.offsetHeight)/2) + 'px';
      bttn.onclick = function () {
        gameInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/cookieclickerunblocked/slp@ddcf1d475e4c9f0c58a6b0cf0cba75b25896b657/slope_new.json", {onProgress: UnityProgress, Module:{onRuntimeInitialized: function() {UnityProgress(gameInstance, "complete")}}});
        this.remove();
      }
    }
  </script>
</body>
</html>
