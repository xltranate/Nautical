        <script>
            // Scale the canvas visually using CSS transform — never touch its pixel dimensions
            function scaleCanvas() {
                var c = document.getElementById('canvas');
                if (!c) return;
                var scaleX = window.innerWidth  / c.width;
                var scaleY = window.innerHeight / c.height;
                var scale  = Math.min(scaleX, scaleY);
                c.style.transform = 'scale(' + scale + ')';
            }
            window.addEventListener('resize', scaleCanvas);
            // Run once after GM has had a chance to set up the canvas
            setTimeout(scaleCanvas, 200);
        </script>

        <script>window.onload = GameMaker_Init;</script>
