<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{width:100%;height:100%;overflow:hidden}
#game-wrapper{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999}
#game-area{border:none;display:block;width:100%;height:100%}
#close-btn{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.5);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:20px;z-index:10000;transition:background 0.2s}
#close-btn:hover{background:rgba(0,0,0,0.8)}
#fs-btn{position:absolute;top:12px;right:56px;background:rgba(0,0,0,0.5);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:18px;z-index:10000;transition:background 0.2s}
#fs-btn:hover{background:rgba(0,0,0,0.8)}
</style>
<div id="game-wrapper">
  <button id="close-btn" onclick="document.getElementById('game-wrapper').style.display='none'">✕</button>
  <button id="fs-btn" onclick="toggleFS()">⛶</button>
  <iframe id="game-area" src="https://inkyedu118.github.io/g69/class-633" scrolling="no" frameborder="0" allowfullscreen allow="fullscreen"></iframe>
</div>
<script>
function toggleFS(){
  const w = document.getElementById('game-wrapper');
  if(!document.fullscreenElement){
    w.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
}
</script>
