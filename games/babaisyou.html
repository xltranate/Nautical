 window._onRecentGameLoaded = function() {
 _startTimer();
 };

 // Also start if iframe sends gameLoaded postMessage (no-op if already started)
 window.addEventListener('message', function(event) {
 if (!event.data) return;
 var action = typeof event.data === 'object' ? event.data.action : event.data;
 if (action === 'gameLoaded') {
 _startTimer();
 }
 });

 // If user leaves before 45s — clear timer, do not add
 window.addEventListener('beforeunload', function() {
 clearTimeout(_timer);
 });
 })();
