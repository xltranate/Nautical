<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Game</title>
    <style>
        /* Remove default margins and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Black background while loading */
        }

        /* Force the iframe to fill the entire screen */
        .fullscreen-iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        class="fullscreen-iframe" 
        id="game-area" 
        src="https://geometry-dash-lite.1games.io/" 
        allow="autoplay; fullscreen; camera; gamepad; keyboard-map *; clipboard-write; accelerometer; gyroscope" 
        sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-scripts allow-same-origin allow-downloads" 
        scrolling="no" 
        allowfullscreen>
    </iframe>

</body>
</html>
