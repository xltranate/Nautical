<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara Go - Fullscreen</title>
    <style>
        /* Erase browser margins and hide layout scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Dark backdrop while the game loads */
        }

        /* Stretch the game iframe to match the exact size of the window viewport */
        .game-iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        class="game-iframe" 
        id="game-area" 
        src="https://html5.gamedistribution.com/63e8c2d0709e452f842f261a7c9f43f9/?gd_sdk_referrer_url=https://geometry-dashonline.io/capybara-go" 
        allow="autoplay; fullscreen; camera; gamepad; keyboard-map *; clipboard-write; accelerometer; gyroscope" 
        sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-scripts allow-same-origin allow-downloads" 
        scrolling="no" 
        allowfullscreen>
    </iframe>

</body>
</html>
