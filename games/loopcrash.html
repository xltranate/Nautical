<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Crash - Fullscreen</title>
    <style>
        /* Eliminates gaps around the edges and removes standard browser scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Forces the game frame to stretch to the exact size of the browser viewport */
        .game-iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        class="game-iframe" 
        id="game-area" 
        src="https://loop-crash.1games.io/" 
        allow="autoplay; fullscreen; camera; gamepad; keyboard-map *; clipboard-write; accelerometer; gyroscope" 
        sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-scripts allow-same-origin allow-downloads" 
        scrolling="no" 
        allowfullscreen>
    </iframe>

</body>
</html>
