        .hero-content { position: relative; z-index: 5; text-align: center; }

        .game-count { color: rgba(224, 244, 248, 0.6); font-size: 14px; }

        select:hover { border-color: rgba(201, 162, 39, 0.6); }
        
        /* Grid Sections */
        .section-header { display: flex; align-items: center; gap: 12px; margin: 50px 0 25px; font-family: 'Cinzel', serif; font-size: 22px; color: #e8c44a; text-transform: uppercase; letter-spacing: 2px; }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 50px; }
        
        /* Game Cards wrapped in <a> elements */
        .game-card { text-decoration: none; background: rgba(5, 17, 26, 0.85); border: 1px solid rgba(201, 162, 39, 0.15); border-radius: 10px; overflow: hidden; transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; cursor: pointer; position: relative; display: flex; flex-direction: column; height: 100%; opacity: 0; transform: translateY(20px); animation: cardEntrance 0.5s ease-out forwards; }

        .game-card::before { content: ''; position: absolute; inset: 0; border: 2px solid rgba(201, 162, 39, 0.2); border-radius: 10px; pointer-events: none; }
        .game-card::after { content: ''; position: absolute; top: 10px; left: 10px; width: 10px; height: 10px; border: 1px solid rgba(201, 162, 39, 0.5); border-right: none; border-bottom: none; }
        
        .game-image { width: 100%; height: 130px; background: rgba(0, 229, 255, 0.03); display: flex; align-items: center; justify-content: center; font-size: 50px; overflow: hidden; border-bottom: 1px solid rgba(201, 162, 39, 0.1); color: #e8c44a; }

        .game-title { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; color: #e8c44a; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; line-height: 1.3; }

        footer span { vertical-align: middle; }
        
        /* Animations */
        @keyframes cardEntrance { to { opacity: 1; transform: translateY(0); } }

        }

        // Update Total Expedition Counter Text
        document.getElementById('gameCountText').innerText = `${games.length} charted expeditions`;

        // Render Grid Items
        function displayGames(filteredGames) {
            const gamesGrid = document.getElementById('gamesGrid');
            const featuredGrid = document.getElementById('featuredGrid');
            const featuredTitle = document.getElementById('featuredTitle');
            const sortVal = document.getElementById('sortSelect').value;
            
            gamesGrid.innerHTML = '';
            featuredGrid.innerHTML = '';

            const featuredGamesList = sortVal === 'apps' ? [] : filteredGames.filter(g => g.featured);
            const standardGamesList = sortVal === 'apps' ? filteredGames : filteredGames.filter(g => !g.featured);

            if(featuredGamesList.length === 0) {
                featuredTitle.style.display = 'none';
            } else {
                featuredTitle.style.display = 'flex';
                featuredGamesList.forEach((game, index) => {
                    featuredGrid.appendChild(createGameCard(game, index));
                });
            }

            standardGamesList.forEach((game, index) => {
                gamesGrid.appendChild(createGameCard(game, index));
            });
        }

        function createGameCard(game, index) {
            const card = document.createElement('a');
            card.className = 'game-card';
            card.style.animationDelay = `${index * 0.03}s`;
            
            card.href = game.directUrl ? game.link : `${BASE_URL}${game.link}`;

            let imageContent = '';
            if (game.img) {
                imageContent = `<img src="${game.img}" alt="${game.name}">`;
            } else if (game.icon) {
                imageContent = game.icon;
            }

            card.innerHTML = `
                <div class="game-image">${imageContent}</div>
                <div class="game-info">
                    <div class="game-title">${game.name}</div>
                    <div class="game-desc">${game.desc || 'No chart data logged yet.'}</div>
                </div>
            `;
            return card;
        }

        // Logic for Filter Engines (Search & Sort Options)
        function filterAndSortGames() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const sortVal = document.getElementById('sortSelect').value;

            let results = games.filter(game => {
                return game.name.toLowerCase().includes(searchVal) || 
                       game.desc.toLowerCase().includes(searchVal);
            });

            if (sortVal === 'apps') {
                results = results.filter(game => game.directUrl === true);
            } else if (sortVal === 'newest') {
                results.sort((a, b) => b.originalIndex - a.originalIndex);
            } else if (sortVal === 'alphabetical') {
                results.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortVal === 'reverse') {
                results.sort((a, b) => b.name.localeCompare(a.name));
            }

            displayGames(results);
        }

        document.getElementById('searchInput').addEventListener('input', filterAndSortGames);
        document.getElementById('sortSelect').addEventListener('change', filterAndSortGames);

        // --- Deep-Sea Particle Engine Background Logic ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = -(Math.random() * 0.6 + 0.1);
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#00e5ff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 75; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
        filterAndSortGames();
    </script>
